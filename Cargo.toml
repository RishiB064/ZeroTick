[package]
name = "zerotick"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Zero-dependency, single-file high-throughput financial time-series database & microstructure engine"

[dependencies]
# Left intentionally blank

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "zerotick"
path = "engine.rs"
